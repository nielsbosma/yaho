# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/desktop"
      - "/cli"
      - "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
