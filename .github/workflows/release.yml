# Build, sign and publish Yaho for all five platforms.
#
#   A GitHub release (tag vX.Y.Z)  -> builds, signs, publishes to npm, attaches the installers to the release.
#                                     A pre-release tag (v0.2.0-rc.1) publishes under the npm tag "next".
#   Run by hand (publish: false)   -> builds and signs everything, publishes nothing: a dry run.
#   Both also build Yaho Server (docker/Dockerfile) for amd64 and arm64; a release pushes it to ghcr.io/nielsbosma/yaho.
#
# Signing: Windows with Azure Artifact Signing (OIDC, no secret; tools/setup-signing.ps1 sets it up), macOS with the
# Developer ID certificate and notarization (secrets MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER). Both live in the "release" environment, which only tags v* and main may use.
# npm: the NPM_TOKEN secret until trusted publishing is turned on for each package.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and the release (false = dry run)
        type: boolean
        default: false

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOPBASE_VERSION: '0.1.9'
  # The commit that tag pointed at when it was pinned; tools/build-dopbase.mjs refuses any other.
  DOPBASE_COMMIT: 'e3e528f0ac652a7d706dc2995ada6b21dda1b5ff'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc -p .
      - run: node_modules/.bin/vp test run
      - id: v
        name: Version from the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p "require('./package.json').version")"
          fi
          case "$v" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Yaho $v (npm tag $tag)"

  build:
    needs: check
    environment: release
    strategy:
      # Every platform runs to the end, so one run shows all problems; publish still needs all five.
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Azure login for Windows signing.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node -e "const f='package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      # Dopbase, built from its pinned tag on each platform (it publishes no Windows binary).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dopbase
        with:
          path: vendor/dopbase
          key: dopbase-${{ env.DOPBASE_VERSION }}-${{ env.DOPBASE_COMMIT }}-${{ matrix.platform }}
      - if: steps.dopbase.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - if: steps.dopbase.outputs.cache-hit != 'true'
        shell: bash
        run: node tools/build-dopbase.mjs "$DOPBASE_VERSION" "$DOPBASE_COMMIT"

      # Windows signing: OIDC login, then signtool with Microsoft's signing dlib.
      - if: runner.os == 'Windows'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.WINDOWS_SIGNING_SUBSCRIPTION_ID }}
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: ./tools/prepare-windows-signing.ps1

      # macOS signing: our own throwaway keychain with the Developer ID identity (electron-builder's own import fails to
      # unlock its keychain on these runners), as filestar/build-scripts does. electron-builder then finds the identity
      # by name. The Bosma certificate is issued by Apple's Developer ID G2 CA, which codesign needs alongside it.
      - if: runner.os == 'macOS'
        name: Signing keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PWD="$(uuidgen)"
          P12="$RUNNER_TEMP/signing.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          security import "$P12" -k "$KC" -P "$MACOS_CERTIFICATE_PWD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild
          security import tools/DeveloperIDG2CA.cer -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -qF 'Developer ID Application: Bosma Interactive (933R348T44)'
      - if: runner.os == 'macOS'
        name: Notary key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          # The identity from the signing keychain, by name (without the "Developer ID Application:" prefix).
          CSC_NAME: ${{ runner.os == 'macOS' && 'Bosma Interactive (933R348T44)' || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
        run: node tools/package.mjs --npm

      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: ./tools/verify-windows-signing.ps1
      - if: runner.os == 'macOS'
        name: Verify signature and notarization
        run: |
          app="$(ls -d apps/desktop/release/mac*/Yaho.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application: Bosma Interactive'
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"

      # Smoke test: the packaged core starts, answers /api/health and stops.
      - name: Smoke test
        shell: bash
        run: |
          export YAHO_DATA_DIR="$RUNNER_TEMP/yaho-smoke" YAHO_NO_DOPBASE=1
          case "$RUNNER_OS" in
            Windows) exe="$(ls apps/desktop/release/win-unpacked/Yaho.exe)" ;;
            macOS) exe="$(ls -d apps/desktop/release/mac*/Yaho.app | head -1)/Contents/MacOS/Yaho" ;;
            Linux) exe="$(ls -d apps/desktop/release/linux*-unpacked | head -1)/yaho" ;;
          esac
          # Linux: as the yaho launcher starts it (the sandbox helper cannot be setuid root in an npm install).
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; flags="--no-sandbox"; else run=""; flags=""; fi
          $run "$exe" $flags --serve &
          for i in $(seq 1 60); do
            if [ -f "$YAHO_DATA_DIR/server.yaml" ]; then
              url="$(sed -n 's/^url: *//p' "$YAHO_DATA_DIR/server.yaml")"
              if curl -fsS "$url/api/health"; then echo; echo "core answered at $url"; kill %1 || true; exit 0; fi
            fi
            sleep 2
          done
          echo "the packaged core did not start"; exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ matrix.platform }}
          path: apps/desktop/release/npm/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [check, build]
    if: github.event_name == 'release' || inputs.publish
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # The release upload, and npm provenance.
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      # Only our own artifacts: the Docker steps add build records that cannot be downloaded this way.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: { path: dist, pattern: npm-* }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: { path: dist, pattern: installer-* }
      - name: Publish to npm (the five apps, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          set -e
          for p in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            (cd "dist/npm-$p/yaho-$p" && npm publish --access public --provenance --tag "$TAG")
          done
          # The launcher is the same on every platform; take the Linux one.
          (cd dist/npm-linux-x64/yaho && npm publish --access public --provenance --tag "$TAG")
      - name: Installers and checksums on the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          find dist -maxdepth 2 -path 'dist/installer-*' -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS)
          gh release upload "$RELEASE_TAG" out/* --repo "$REPO" --clobber

  # ---- Yaho Server: the Docker image, built natively per architecture, then joined into one multi-arch image ----
  image:
    needs: check
    env:
      # docker/build-push-action uploads a build record as an artifact; the publish job does not want it.
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node -e "const f='package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: yaho:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      # The server refuses to run without a password or a volume, signs in with the password, and keeps its data
      # through a restart.
      - name: Smoke test
        run: |
          set -e
          ! docker run --rm -v yaho-smoke:/data yaho:smoke 2>err.txt; grep -q YAHO_PASSWORD err.txt
          ! docker run --rm -e YAHO_PASSWORD=smoke-password-1234 yaho:smoke 2>err.txt; grep -q 'No volume on /data' err.txt
          docker run -d --name yaho-smoke -p 4700:4700 -v yaho-smoke:/data -e YAHO_PASSWORD=smoke-password-1234 -e YAHO_TOTP=1 yaho:smoke
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4700/api/health && break; sleep 2; done; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/api/agents)" = 401
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"password":"smoke-password-1234"}' http://127.0.0.1:4700/api/session
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:4700/api/agents)" = 401
          key=$(curl -fsS -b jar http://127.0.0.1:4700/api/session/totp | node -p 'JSON.parse(require("fs").readFileSync(0)).secret')
          curl -fsS -b jar -c jar -H 'Content-Type: application/json' -d "{\"code\":\"$(node tools/totp.mjs "$key")\"}" http://127.0.0.1:4700/api/session/totp
          curl -fsS -b jar -X POST -H 'Content-Type: application/json' -d '{"name":"smoke","briefing":"Smoke test.","enabled":false}' http://127.0.0.1:4700/api/agents > /dev/null
          docker exec yaho-smoke sh -c 'echo kept > /data/home/.claude-smoke'
          docker restart yaho-smoke
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4700/api/health && break; sleep 2; done; echo
          curl -fsS -b jar http://127.0.0.1:4700/api/agents | grep -q '"smoke"'
          docker exec yaho-smoke cat /data/home/.claude-smoke | grep -q kept
          docker exec yaho-smoke yaho doctor || true
          docker exec yaho-smoke claude --version
          docker exec yaho-smoke codex --version
          docker logs yaho-smoke | tail -20
      - name: Push by digest
        id: push
        if: github.event_name == 'release' || inputs.publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
      - if: github.event_name == 'release' || inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          d="$DIGEST"
          touch "digests/${d#sha256:}"
      - if: github.event_name == 'release' || inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  image-publish:
    needs: [check, image, publish]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: digests
        env:
          V: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          repo="ghcr.io/$GITHUB_REPOSITORY"
          tags="-t $repo:$V -t $repo:$TAG"
          case "$V" in *-*) ;; *) tags="$tags -t $repo:${V%.*}" ;; esac
          docker buildx imagetools create $tags $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:$V"
